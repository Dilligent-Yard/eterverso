name: eterverso-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: eterverso
      POSTGRES_USER: eterverso
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eterverso -d eterverso"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
